name: Memento
options:
  bundleIdPrefix: com.kaushikandra
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
targets:
  Memento:
    type: application
    platform: iOS
    sources:
      - Memento
    info:
      path: Memento/Info.plist
      properties:
        NSMicrophoneUsageDescription: Memento needs microphone access to record conversations and detect laughter highlights.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaushikandra.Memento
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  MementoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MementoTests
    dependencies:
      - target: Memento
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaushikandra.MementoTests
        GENERATE_INFOPLIST_FILE: YES
